<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" fill="none">
  <defs>
    <linearGradient id="ribbonWarm" x1="80" y1="220" x2="470" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/><stop offset=".48" stop-color="#FACC15"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="ribbonCool" x1="730" y1="230" x2="360" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="90" y1="650" x2="700" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/><stop offset=".45" stop-color="#22C55E"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="globe" cx="35%" cy="25%" r="80%">
      <stop stop-color="#8BE5FF"/><stop offset=".42" stop-color="#259DD7"/><stop offset="1" stop-color="#075985"/>
