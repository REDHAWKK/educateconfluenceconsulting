    <linearGradient id="skinDeep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6B3527"/><stop offset="1" stop-color="#351711"/></linearGradient>
    <linearGradient id="skinMid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A95C3C"/><stop offset="1" stop-color="#5A281D"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263B63"/><stop offset="1" stop-color="#101D3B"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type=" linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="globeClip"><circle cx="405" cy="365" r="166"/></clipPath>
